<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>Opération Lille</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎮</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- HUD : jauge globale, masquée sur l'écran titre -->
  <header id="hud" class="hidden">
    <div class="hud-line">
      <span class="hud-label">Chargement du déménagement</span>
      <span class="hud-pct" id="hud-pct">0%</span>
    </div>
    <div class="segbar" id="segbar" aria-hidden="true"></div>
  </header>

  <!-- Toutes les scènes sont injectées ici -->
  <main id="stage"></main>

  <button id="sound-toggle" type="button" aria-label="Son">♪</button>

</div>

<!-- Effets plein écran -->
<div id="scanlines" aria-hidden="true"></div>
<div id="wipe" aria-hidden="true"></div>

<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/main.js"></script>
<script src="js/levels/level1.js"></script>
<script src="js/levels/level2.js"></script>
<script src="js/levels/level3.js"></script>
<script src="js/levels/level4.js"></script>
<script src="js/levels/level5.js"></script>
<script src="js/levels/level_tetris.js"></script>
<script src="js/levels/level6.js"></script>
<script src="js/album.js"></script>
<script src="js/chat.js"></script>
<script>Game.boot();</script>

</body>
</html>
